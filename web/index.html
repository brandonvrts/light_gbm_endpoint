<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTS Prediction Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll,#2a2a2e); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes rtsPulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  @keyframes rtsShimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
  .rts-skel { background: linear-gradient(90deg, var(--panel2,#1e1e21) 0px, var(--border,#2a2a2e) 200px, var(--panel2,#1e1e21) 400px); background-size: 800px 100%; animation: rtsShimmer 1.3s infinite linear; border-radius: 10px; }
  body { font-family:'Inter Tight',system-ui,sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script>window.__GBME_KEY__ = "__GBME_API_KEY__";</script>
<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;
const RC = window.Recharts;
const KEY = window.__GBME_KEY__ || "";
// Resolve an absolute API base so fetch works even when the page is embedded in a
// sandboxed/srcdoc preview frame (no usable base URL -> relative paths fail to parse).
// For real LAN users this is just location.origin, so behavior is unchanged.
const API_BASE = (function(){
  const ok = (u) => typeof u === "string" && /^https?:\/\//.test(u);
  try { if (ok(location.origin)) return location.origin; } catch(e){}
  try { if (ok(document.referrer)) return new URL(document.referrer).origin; } catch(e){}
  try { if (ok(document.baseURI)) return new URL(document.baseURI).origin; } catch(e){}
  return "http://localhost:8910";
})();
const apiUrl = (path) => API_BASE + path;
const RISK = { low:'#16a34a', medium:'#f59e0b', high:'#dc2626' };
const BUILDINGS = ['Country Club Village','Sierra Pointe','Residences at 62W','Winwood'];
const NAME_TO_ID = { 'Country Club Village':62, 'Sierra Pointe':72, 'Residences at 62W':82, 'Winwood':26 };

async function jpost(path, body){
  const r = await fetch(apiUrl(path),{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':KEY},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(path+' -> '+r.status);
  return r.json();
}
async function jget(path){
  const r = await fetch(apiUrl(path),{headers:{'X-API-Key':KEY}});
  if(!r.ok) throw new Error(path+' -> '+r.status);
  return r.json();
}
const api = {
  predictMultifamily: ({buildings, asOf}) => {
    const ids = (buildings&&buildings.length?buildings:BUILDINGS).map(n=>NAME_TO_ID[n]).filter(Boolean);
    return jpost('/predict/multifamily-churn', {property_ids:ids, as_of:asOf});  // no limit -> ALL occupied units
  },
  multifamilyBacktest: ({buildings, asOf}) => {
    const ids = (buildings&&buildings.length?buildings:BUILDINGS).map(n=>NAME_TO_ID[n]).filter(Boolean);
    return jpost('/multifamily/backtest', {property_ids:ids, as_of:asOf, limit:250});  // sampled for speed
  },
  listBrokerageCompanies: async () => {
    const d = await jget('/brokerage/companies?limit=60');
    return (d.companies||[]).map(c=>({hMy:c.hMy, display_name:c.display_name, snapshots:c.snapshots}));
  },
  predictBrokerage: ({companyId, query}) => jpost('/predict/signal-desk-brokerage', {company:String(query||companyId)}),
  brokerageScorecard: (sort) => jget('/brokerage/scorecard?limit=25&sort='+(sort||'winprob')),
  aggregateMarketing: ({mode, key}) => jpost('/predict/marketing', {variant:mode, key}),
  marketingOptions: () => jget('/marketing/options'),
  models: () => jget('/models'),
  marketingTargeting: () => jget('/marketing/targeting'),
};

const pct = (x,d=0)=> (x*100).toFixed(d)+'%';
const tierColor = (t)=> RISK[t] || '#8e8e96';
const tierBadge = (t)=>{ const c=tierColor(t); return { display:'inline-block',padding:'3px 10px',borderRadius:999,fontSize:11,fontWeight:600,textTransform:'capitalize',color:c,background:`color-mix(in srgb,${c} 16%,transparent)`,border:`1px solid color-mix(in srgb,${c} 38%,transparent)`}; };

function App(){
  const [view,setView]=useState('mf');
  const [dark,setDark]=useState(true);
  const [loading,setLoading]=useState(false);
  const [anim,setAnim]=useState(1);
  // mf
  const [mfData,setMfData]=useState(null);
  const [selBuildings,setSelBuildings]=useState([...BUILDINGS]);
  const [asOf,setAsOf]=useState('2026-06-23');
  const [mfBacktest,setMfBacktest]=useState(null);
  const [btLoading,setBtLoading]=useState(false);
  const [maxUnits,setMaxUnits]=useState(120);
  const [sortKey,setSortKey]=useState('churn_probability');
  const [sortDir,setSortDir]=useState('desc');
  // bk
  const [bkData,setBkData]=useState(null);
  const [bkCompanies,setBkCompanies]=useState([]);
  const [bkCompany,setBkCompany]=useState('1449');
  const [bkQuery,setBkQuery]=useState('');
  const [bkScorecard,setBkScorecard]=useState(null);
  const [bkSort,setBkSort]=useState('winprob');
  // mk
  const [mkData,setMkData]=useState(null);
  const [mkMode,setMkMode]=useState('cohort');
  const [mkKey,setMkKey]=useState('healthcare-vertical');
  const [mkCohorts,setMkCohorts]=useState(['healthcare-vertical','growth-mode','tech-vertical','lease-expiring-12mo']);
  const [mkIndustries,setMkIndustries]=useState(['Banking','Retail','Healthcare','Manufacturing','Technology']);
  // model validation
  const [modelCards,setModelCards]=useState(null);
  const [mkTargeting,setMkTargeting]=useState(null);

  const T = dark
    ? { grid:'rgba(255,255,255,0.07)', axis:'#6b6b73', tick:'#a8a8b0', accent:'#5b8def', panel:'#161618', text:'#ededef' }
    : { grid:'rgba(0,0,0,0.07)', axis:'#9aa0a6', tick:'#52525b', accent:'#2563eb', panel:'#ffffff', text:'#18181b' };
  const V = dark
    ? {'--bg':'#0a0a0b','--panel':'#161618','--panel2':'#1e1e21','--border':'rgba(255,255,255,.08)','--text':'#ededef','--muted':'#8e8e96','--accent':'#5b8def','--scroll':'#2a2a2e','--scheme':'dark'}
    : {'--bg':'#f6f6f7','--panel':'#ffffff','--panel2':'#f1f1f3','--border':'rgba(0,0,0,.08)','--text':'#18181b','--muted':'#6b7280','--accent':'#2563eb','--scroll':'#d4d4d8','--scheme':'light'};

  const startTween=()=>{ const t0=performance.now(),dur=750; setAnim(0);
    const step=(now)=>{ const p=Math.min(1,(now-t0)/dur); setAnim(1-Math.pow(1-p,3)); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); };

  const runMF=async()=>{ setLoading(true); try{ const d=await api.predictMultifamily({buildings:selBuildings,asOf}); setMfData(d);}catch(e){setMfData({error:String(e),results:[]});} setLoading(false); startTween(); };
  const runBacktest=async()=>{ setBtLoading(true); setMfBacktest(null); try{ setMfBacktest(await api.multifamilyBacktest({buildings:selBuildings,asOf})); }catch(e){ setMfBacktest({error:String(e)}); } setBtLoading(false); };
  const runBK=async()=>{ setLoading(true); try{ const d=await api.predictBrokerage({companyId:bkCompany,query:bkQuery}); setBkData(d); if(d.company) setBkCompany(String(d.company.hMy)); }catch(e){setBkData({error:String(e)});} setLoading(false); startTween(); };
  const runMK=async()=>{ setLoading(true); try{ const d=await api.aggregateMarketing({mode:mkMode,key:mkKey}); setMkData(d);}catch(e){setMkData({error:String(e)});} setLoading(false); startTween(); };
  const loadModels=async()=>{ setLoading(true); try{ setModelCards(await api.models()); }catch(e){ setModelCards([{error:String(e)}]); } setLoading(false); };
  const loadScorecard=async(s)=>{ setBkSort(s); try{ setBkScorecard(await api.brokerageScorecard(s)); }catch(e){} };

  useEffect(()=>{ (async()=>{
    try{ setBkCompanies(await api.listBrokerageCompanies()); }catch(e){}
    try{ setBkScorecard(await api.brokerageScorecard('winprob')); }catch(e){}
    try{ const o=await api.marketingOptions();
      const cohorts=(o.cohorts||[]).map(c=>c.ConceptKey).filter(Boolean);
      const inds=(o.industries||[]).map(i=>i.industry).filter(Boolean);
      if(cohorts.length) setMkCohorts(cohorts);
      if(inds.length) setMkIndustries(inds);
    }catch(e){}
    try{ setMkTargeting(await api.marketingTargeting()); }catch(e){}
    runMF();
  })(); },[]);

  const switchView=(v)=>{ setView(v); if(v==='bk'&&!bkData) runBK(); if(v==='mk'&&!mkData) runMK(); if(v==='mv'&&!modelCards) loadModels(); };

  const ready = !loading && !!(view==='mf'?mfData:view==='bk'?bkData:view==='mk'?mkData:modelCards);
  const headers = {
    mf:{k:'Multifamily',t:'Tenant Move-Out Risk',d:'Score tenants by likelihood of moving out at lease end. Prioritize retention outreach using calibrated churn probabilities from the shared LightGBM model.'},
    bk:{k:'Brokerage · Signal Desk',t:'Prospect Conversion',d:'Track a company’s modeled conversion probability across snapshots and compare it against the current rules-based score.'},
    mk:{k:'Marketing',t:'Cohort & Industry Analytics',d:'Aggregate win probability across markets, deciles, verticals and size bands to find the highest-yield segments.'},
    mv:{k:'Model validation',t:'Model Validation & Metrics',d:'Training design, discrimination (ROC-AUC variants), Brier / log loss, and calibration internals for every served model — for the technical sector.'},
  }[view];
  const activeData = view==='mf'?mfData:view==='bk'?bkData:view==='mk'?mkData:null;
  const modelVersion = (activeData&&activeData.model_version)||'—';
  const modelSource = (activeData&&activeData.model_source)||'—';
  const isInterim = modelSource!=='real-production';
  const asOfStr = (activeData&&activeData.as_of)||(activeData&&activeData.data_as_of)||new Date().toISOString().slice(0,10);
  const caption = `model: ${modelVersion} · ${isInterim?'interim stand-in':'real / validated'} · data as-of ${asOfStr}`;

  // shared styles
  const card = {padding:'18px 20px',borderRadius:14,border:'1px solid var(--border)',background:'var(--panel)'};
  const chartCard = {...card,padding:'18px 20px 8px'};
  const runBtn = {padding:'10px 22px',borderRadius:10,border:'none',cursor:loading?'wait':'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,color:'#fff',background:'linear-gradient(135deg,#5b8def,#6366f1)',boxShadow:'0 2px 12px rgba(91,141,239,.35)',opacity:loading?0.6:1,transition:'opacity .15s'};
  const lbl = {fontSize:11,fontWeight:600,color:'var(--muted)',marginBottom:8};
  const tip = { contentStyle:{background:T.panel,border:`1px solid ${T.grid}`,borderRadius:10,fontSize:12,color:T.text,fontFamily:"'Inter Tight',sans-serif"}, cursor:{fill:'rgba(127,127,140,0.08)'}, itemStyle:{color:T.text}, labelStyle:{color:T.tick} };
  const axTick = {fill:T.tick,fontSize:11,fontFamily:"'JetBrains Mono',monospace"};
  const axisLine = {stroke:T.grid};

  const KPI = ({label,display,color,sub}) => (
    <div style={card}>
      <div style={{fontSize:11.5,fontWeight:600,color:'var(--muted)',marginBottom:10}}>{label}</div>
      <div style={{fontSize:30,fontWeight:700,letterSpacing:'-.02em',fontFamily:"'JetBrains Mono',monospace",color:color||'var(--text)'}}>{display}</div>
      <div style={{fontSize:11.5,color:'var(--muted)',marginTop:6}}>{sub}</div>
    </div>
  );
  const Skel = ({h}) => <div className="rts-skel" style={{height:h}}></div>;

  // ---------------- chart builders ----------------
  function MFCharts(){
    const res=mfData.results;
    const bins=Array.from({length:20},(_,i)=>({x:(i*5)+'%',center:(i+0.5)/20,count:0}));
    res.forEach(r=>{const idx=Math.min(19,Math.floor(r.churn_probability*20)); bins[idx].count++;});
    const TT=(mfData.tier_thresholds)||{low_max:0.25,medium_max:0.45};
    bins.forEach(b=>b.tier=b.center>=TT.medium_max?'high':b.center>=TT.low_max?'medium':'low');
    const counts={low:0,medium:0,high:0}; res.forEach(r=>counts[r.risk_tier]=(counts[r.risk_tier]||0)+1);
    const pie=[{name:'Low',value:counts.low,c:RISK.low},{name:'Medium',value:counts.medium,c:RISK.medium},{name:'High',value:counts.high,c:RISK.high}];
    const top=[...res].sort((a,b)=>b.churn_probability-a.churn_probability).slice(0,15).map(r=>({name:r.full_name||r.scode,p:r.churn_probability}));
    const maxP=top.length?top[0].p:1;
    return (<>
      <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:16,marginBottom:16}}>
        <div style={chartCard}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><div style={{fontSize:13.5,fontWeight:600}}>Move-out probability distribution</div><div style={{fontSize:11,color:'var(--muted)'}}>20 bins · colored by risk tier</div></div>
          <div style={{height:280}}><RC.ResponsiveContainer width="100%" height="100%">
            <RC.BarChart data={bins} margin={{top:8,right:8,left:-14,bottom:0}}>
              <RC.CartesianGrid strokeDasharray="3 3" stroke={T.grid} vertical={false}/>
              <RC.XAxis dataKey="x" interval={3} tick={axTick} axisLine={axisLine} tickLine={false}/>
              <RC.YAxis tick={axTick} axisLine={axisLine} tickLine={false}/>
              <RC.Tooltip {...tip} formatter={(v)=>[v,'tenants']}/>
              <RC.Bar dataKey="count" radius={[3,3,0,0]} animationDuration={700}>{bins.map((b,i)=><RC.Cell key={i} fill={tierColor(b.tier)}/>)}</RC.Bar>
            </RC.BarChart></RC.ResponsiveContainer></div>
        </div>
        <div style={chartCard}>
          <div style={{fontSize:13.5,fontWeight:600,marginBottom:6}}>Risk-tier breakdown</div>
          <div style={{height:280}}><RC.ResponsiveContainer width="100%" height="100%">
            <RC.PieChart>
              <RC.Tooltip {...tip} formatter={(v,n)=>[v+' tenants',n]}/>
              <RC.Pie data={pie} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={62} outerRadius={96} paddingAngle={2} stroke="none" animationDuration={700}>{pie.map((p,i)=><RC.Cell key={i} fill={p.c}/>)}</RC.Pie>
              <text x="50%" y="47%" textAnchor="middle" fill={T.text} fontSize={26} fontWeight={700} fontFamily="'JetBrains Mono',monospace">{String(res.length)}</text>
              <text x="50%" y="57%" textAnchor="middle" fill={T.tick} fontSize={11}>scored</text>
            </RC.PieChart></RC.ResponsiveContainer></div>
          <div style={{display:'flex',justifyContent:'center',gap:16,marginTop:2}}>
            {[['Low',RISK.low],['Medium',RISK.medium],['High',RISK.high]].map(([n,c])=>(
              <span key={n} style={{display:'flex',alignItems:'center',gap:6,fontSize:11.5,color:'var(--muted)'}}><span style={{width:9,height:9,borderRadius:2,background:c}}></span>{n}</span>))}
          </div>
        </div>
      </div>
      <div style={{...chartCard,marginBottom:16}}>
        <div style={{fontSize:13.5,fontWeight:600,marginBottom:6}}>Top 15 at-risk tenants</div>
        <div style={{height:380}}><RC.ResponsiveContainer width="100%" height="100%">
          <RC.BarChart data={top} layout="vertical" margin={{top:4,right:40,left:8,bottom:4}}>
            <RC.CartesianGrid strokeDasharray="3 3" stroke={T.grid} horizontal={false}/>
            <RC.XAxis type="number" domain={[0,1]} tickFormatter={(v)=>Math.round(v*100)+'%'} tick={axTick} axisLine={axisLine} tickLine={false}/>
            <RC.YAxis type="category" dataKey="name" width={130} tick={{fill:T.tick,fontSize:11}} axisLine={false} tickLine={false}/>
            <RC.Tooltip {...tip} formatter={(v)=>[(v*100).toFixed(1)+'%','move-out prob']}/>
            <RC.Bar dataKey="p" radius={[0,4,4,0]} animationDuration={700}>
              {top.map((t,i)=>{const f=t.p/maxP; const g=Math.round(165-105*f); return <RC.Cell key={i} fill={`rgb(220,${g},${g})`}/>;})}
              <RC.LabelList dataKey="p" position="right" formatter={(v)=>(v*100).toFixed(0)+'%'} fill={T.tick} fontSize={11} fontFamily="'JetBrains Mono',monospace"/>
            </RC.Bar>
          </RC.BarChart></RC.ResponsiveContainer></div>
      </div>
    </>);
  }

  function BKScorecard(){
    const d=bkScorecard; if(!d||!d.companies||!d.companies.length) return null;
    const mono="'JetBrains Mono',monospace";
    const sorts=[['winprob','Win prob'],['value','Exp. value'],['scoops','Scoop momentum'],['recency','Recency'],['lease','Lease soonest'],['score','REA score']];
    return (<div style={{...card,marginBottom:22}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700}}>Company ranking · who to pursue <span style={{fontSize:11,fontWeight:400,color:'var(--muted)'}}>— company-centric (broker-free), live</span></div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
          {sorts.map(([k,lab])=>(<button key={k} onClick={()=>loadScorecard(k)} style={{padding:'5px 11px',borderRadius:7,border:'1px solid var(--border)',cursor:'pointer',fontFamily:'inherit',fontSize:11,fontWeight:600,background:bkSort===k?'var(--accent)':'transparent',color:bkSort===k?'#fff':'var(--muted)',transition:'all .15s'}}>{lab}</button>))}
        </div>
      </div>
      <div style={{overflowX:'auto',maxHeight:360,overflowY:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead style={{position:'sticky',top:0,background:'var(--panel)'}}><tr>
            {['#','Company','Mkt','Win prob','Cohort wr','Lift','Exp. value','Scoops 90d','Lease mo','Lifecycle'].map(h=><th key={h} style={{textAlign:'left',padding:'8px 12px',fontSize:10.5,fontWeight:600,color:'var(--muted)',whiteSpace:'nowrap'}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {d.companies.map((c,i)=>(<tr key={i} style={{borderTop:'1px solid var(--border)'}}>
              <td style={{padding:'8px 12px',color:'var(--muted)'}}>{i+1}</td>
              <td style={{padding:'8px 12px',fontWeight:600,whiteSpace:'nowrap'}}>{c.company||('company '+c.company_id)}</td>
              <td style={{padding:'8px 12px',color:'var(--muted)'}}>{c.market}</td>
              <td style={{padding:'8px 12px',fontFamily:mono,fontWeight:600,color:'#5b8def'}}>{((c.win_prob||0)*100).toFixed(1)}%</td>
              <td style={{padding:'8px 12px',fontFamily:mono}}>{((c.cohort_win_rate||0)*100).toFixed(1)}%</td>
              <td style={{padding:'8px 12px',fontFamily:mono}}>{(c.concept_lift||1).toFixed(2)}×</td>
              <td style={{padding:'8px 12px',fontFamily:mono}}>{c.expected_value?'$'+Math.round(c.expected_value).toLocaleString():'—'}</td>
              <td style={{padding:'8px 12px',fontFamily:mono}}>{c.scoop_count_90d!=null?c.scoop_count_90d:'—'}</td>
              <td style={{padding:'8px 12px',fontFamily:mono}}>{c.months_to_lease_end!=null?c.months_to_lease_end:'—'}</td>
              <td style={{padding:'8px 12px',textTransform:'capitalize',color:'var(--muted)'}}>{c.lifecycle||'—'}</td>
            </tr>))}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>WinProb = cohort base × concept lift; Exp. value = WinProb × cohort value. All live from rea.CompanyScoreSnapshot — no broker feature.</div>
    </div>);
  }

  function BKChart(){
    const d=bkData; if(!d.history) return null;
    const data=d.history.map(p=>({date:(p.snapshot_date||'').slice(2),p:p.conversion_probability}));
    const rules=(d.current_rules_score&&d.current_rules_score.Probability)||0;
    return (<div style={{...chartCard,marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <div style={{fontSize:13.5,fontWeight:600}}>Conversion probability over time</div>
        <div style={{display:'flex',gap:14,alignItems:'center',fontSize:11,color:'var(--muted)'}}><span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:16,height:2,background:'var(--accent)',display:'inline-block'}}></span>model</span><span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:16,height:0,borderTop:'2px dashed #94a3b8',display:'inline-block'}}></span>current rules</span></div>
      </div>
      <div style={{height:320}}><RC.ResponsiveContainer width="100%" height="100%">
        <RC.AreaChart data={data} margin={{top:8,right:16,left:-14,bottom:0}}>
          <defs><linearGradient id="bkGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.accent} stopOpacity={0.45}/><stop offset="100%" stopColor={T.accent} stopOpacity={0.02}/></linearGradient></defs>
          <RC.ReferenceArea y1={0} y2={0.3} fill={RISK.low} fillOpacity={0.05}/>
          <RC.ReferenceArea y1={0.3} y2={0.6} fill={RISK.medium} fillOpacity={0.05}/>
          <RC.ReferenceArea y1={0.6} y2={1} fill={RISK.high} fillOpacity={0.05}/>
          <RC.CartesianGrid strokeDasharray="3 3" stroke={T.grid} vertical={false}/>
          <RC.XAxis dataKey="date" tick={axTick} axisLine={axisLine} tickLine={false}/>
          <RC.YAxis domain={[0,1]} tickFormatter={(v)=>Math.round(v*100)+'%'} tick={axTick} axisLine={axisLine} tickLine={false}/>
          <RC.Tooltip {...tip} formatter={(v)=>[(v*100).toFixed(1)+'%','conversion prob']}/>
          <RC.ReferenceLine y={rules} stroke="#94a3b8" strokeDasharray="5 4" strokeWidth={1.5} label={{value:'rules '+(rules*100).toFixed(0)+'%',fill:'#94a3b8',fontSize:11,position:'insideTopRight'}}/>
          <RC.Area type="monotone" dataKey="p" stroke={T.accent} strokeWidth={2.5} fill="url(#bkGrad)" dot={{r:3,fill:T.accent,strokeWidth:0}} activeDot={{r:5}} animationDuration={700}/>
        </RC.AreaChart></RC.ResponsiveContainer></div>
    </div>);
  }

            <RC.BarChart data={d.decile_distribution||[]} margin={{top:8,right:8,left:-14,bottom:0}}>
              <RC.CartesianGrid strokeDasharray="3 3" stroke={T.grid} vertical={false}/>
              <RC.XAxis dataKey="Decile" tick={axTick} axisLine={axisLine} tickLine={false}/>
              <RC.YAxis tick={axTick} axisLine={axisLine} tickLine={false}/>
              <RC.Tooltip {...tip} formatter={(v)=>[v,'companies']}/>
              <RC.Bar dataKey="n" radius={[3,3,0,0]} animationDuration={700}>
                {(d.decile_distribution||[]).map((x,i)=>{const f=i/9; const l=Math.round(70-22*f); return <RC.Cell key={i} fill={`hsl(217,80%,${l}%)`}/>;})}
              </RC.Bar>
            </RC.BarChart></RC.ResponsiveContainer></div>
        </div>
      </div>
      <div style={{...card,marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div style={{fontSize:13.5,fontWeight:600}}>Win-rate heatmap · vertical × size band</div><div style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:'var(--muted)'}}><span>0%</span><span style={{width:90,height:10,borderRadius:3,background:'linear-gradient(90deg,color-mix(in srgb,#16a34a 8%,transparent),#16a34a)',display:'inline-block'}}></span><span>{(maxWR*100).toFixed(0)+'%'}</span></div></div>
        <div style={{display:'grid',gridTemplateColumns:'140px repeat(5,1fr)',gap:6,minWidth:560}}>
          <div></div>
          {bands.map(b=><div key={b} style={{fontSize:11,fontWeight:600,textAlign:'center',color:'var(--muted)',textTransform:'capitalize'}}>{b}</div>)}
          {verts.map(v=> (
            <React.Fragment key={v}>
              <div style={{fontSize:11.5,fontWeight:500,display:'flex',alignItems:'center',textTransform:'capitalize',color:'var(--muted)'}}>{v.replace('-',' ')}</div>
              {bands.map(b=>{ const c=grid[v+'|'+b]; const wr=c?c.WinRate:0; const a=maxWR?wr/maxWR:0;
                return <div key={b} title={`${v} · ${b}: ${(wr*100).toFixed(1)}% win · ${c?c.DealCount:0} deals`} style={{height:46,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:600,fontFamily:"'JetBrains Mono',monospace",background:`color-mix(in srgb,#16a34a ${Math.round(a*88+6)}%,var(--panel2))`,color:a>0.55?'#fff':'var(--text)'}}>{c?(wr*100).toFixed(0)+'%':'—'}</div>;})}

  // ---------------- Model validation tab ----------------
  const fmtN=(x)=> (x===null||x===undefined||(typeof x==='number'&&isNaN(x)))?'—':(typeof x==='number'?x.toFixed(3):String(x));
  const fmtP=(x)=> (x===null||x===undefined)?'—':(typeof x==='number'?(Math.abs(x)<=1?(x*100).toFixed(1)+'%':x.toFixed(3)):String(x));
  const statRow=(label,val,sub)=>(<div style={{display:'flex',justifyContent:'space-between',gap:10,padding:'7px 0',borderBottom:'1px solid var(--border)',fontSize:12.5}}><span style={{color:'var(--muted)'}}>{label}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,textAlign:'right'}}>{val}{sub?<span style={{color:'var(--muted)',fontWeight:400}}> {sub}</span>:''}</span></div>);

  function MV(){
    if(!modelCards) return null;
    const sCol=(s)=> s==='real-production'?'#16a34a':s==='interim-standin'?'#f59e0b':s==='interim-corrected'?'#0ea5e9':s==='shadow'?'#a78bfa':'#94a3b8';
    return (<div>
      {modelCards.map((c,ci)=>{
        if(c.error) return <div key={ci} style={{...card,marginBottom:16,color:'#f87171'}}>error: {c.error}</div>;
        const sc=sCol(c.status), D=c.discrimination||{}, CAL=c.calibration||{}, BR=c.brier||{}, TR=c.training||{};
        return (<div key={ci} style={{...card,marginBottom:18}}>
          <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',marginBottom:14}}>
            <div style={{fontSize:16,fontWeight:700}}>{c.contract}</div>
            {c.version && <span style={{fontSize:11,fontFamily:"'JetBrains Mono',monospace",color:'var(--muted)'}}>{c.version}</span>}
            <span style={{fontSize:11,fontWeight:600,padding:'3px 10px',borderRadius:999,color:sc,background:`color-mix(in srgb,${sc} 15%,transparent)`,border:`1px solid color-mix(in srgb,${sc} 38%,transparent)`}}>{c.label}</span>
            {c.algorithm && <span style={{fontSize:11,color:'var(--muted)'}}>{c.algorithm}{c.horizon_days?` · ${c.horizon_days}d horizon`:''}{c.feature_count?` · ${c.feature_count} features`:''}</span>}
          </div>

          {c.status==='real-production' && (<div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:16}}>
              <KPI label="Walk-forward ROC-AUC" display={fmtN(D.walkforward_auc_mean)} color="#22c55e" sub={`±${fmtN(D.walkforward_auc_std)} · ${D.walkforward_folds} folds`}/>
              <KPI label="Group-split test AUC" display={fmtN(D.group_split_test_auc)} sub={`train ${fmtN(D.group_split_train_auc)}`}/>
              <KPI label="Group K-Fold AUC" display={fmtN(D.group_kfold_auc_mean)} sub={`±${fmtN(D.group_kfold_auc_std)}`}/>
              <KPI label="PR-AUC" display={fmtN(D.pr_auc)} sub={`no-skill ${fmtN(D.pr_auc_no_skill)} · paper`}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>How it was trained</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:6}}>{TR.design}</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:10}}>{TR.validation}</div>
                {statRow('Training samples', TR.n_samples!=null?TR.n_samples.toLocaleString():'—')}
                {statRow('Unique tenants', TR.n_tenants!=null?TR.n_tenants.toLocaleString():'—')}
                {statRow('Cohort base rate', fmtP(TR.churn_rate))}
                {statRow('Window', `${TR.decision_date_min||'?'} → ${TR.decision_date_max||'?'}`)}
                {statRow('Overfit gap', fmtN(D.overfit_gap))}
                {statRow('Log loss', `${fmtN(D.log_loss)}`, 'paper')}
              </div>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>Calibration</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:10}}>{CAL.method} — anchored to the validated {fmtP(CAL.base_rate_target)} non-renewal base rate.</div>
                {statRow('Mean prediction', `${fmtP(CAL.mean_pred_pre)} → ${fmtP(CAL.mean_pred_post)}`, 'pre→post')}
                {statRow('Platt (a, b)', `${fmtN(CAL.platt_a)}, ${fmtN(CAL.platt_b)}`)}
                {statRow('Probability clip', `[${CAL.prob_floor}, ${CAL.prob_ceil}]`)}
                {statRow('Calibration set', CAL.calibration_set_size!=null?CAL.calibration_set_size.toLocaleString():'—')}
                {statRow('Decision threshold', `${fmtN(CAL.optimal_threshold)}`, `F1 ${fmtN(CAL.optimal_f1)}`)}
                {statRow('Precision / Recall', `${fmtP(CAL.optimal_precision)} / ${fmtP(CAL.optimal_recall)}`, '@thr')}
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1.4fr',gap:16}}>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>Brier score (lower is better)</div>
                {statRow('Raw (uncalibrated)', fmtN(BR.raw))}
                {statRow('Sigmoid (Platt)', fmtN(BR.sigmoid))}
                {statRow('Isotonic (chosen)', fmtN(BR.isotonic))}
                <div style={{fontSize:11.5,color:'#22c55e',marginTop:8}}>isotonic improves Brier by {fmtN((BR.raw||0)-(BR.isotonic||0))} vs raw</div>
              </div>
              <div style={chartCard}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:6}}>Feature importance · top {(c.feature_importance||[]).length}</div>
                <div style={{height:360}}><RC.ResponsiveContainer width="100%" height="100%">
                  <RC.BarChart data={c.feature_importance||[]} layout="vertical" margin={{top:4,right:34,left:10,bottom:4}}>
                    <RC.CartesianGrid strokeDasharray="3 3" stroke={T.grid} horizontal={false}/>
                    <RC.XAxis type="number" tick={axTick} axisLine={axisLine} tickLine={false}/>
                    <RC.YAxis type="category" dataKey="Feature" width={150} tick={{fill:T.tick,fontSize:10}} axisLine={false} tickLine={false}/>
                    <RC.Tooltip {...tip} formatter={(v)=>[Number(v).toFixed(3),'importance']}/>
                    <RC.Bar dataKey="Importance" fill={T.accent} radius={[0,3,3,0]} animationDuration={700}/>
                  </RC.BarChart></RC.ResponsiveContainer></div>
              </div>
            </div>
            {c.notes && <div style={{fontSize:11.5,color:'var(--muted)',marginTop:10}}>{c.notes}</div>}
          </div>)}

          {c.status==='interim-standin' && (<div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:12}}>
              <KPI label="Held-out AUC (interim)" display={fmtN(D.holdout_auc)} color="#f59e0b" sub="leakage-prone"/>
              <KPI label="Training rows" display={TR.n_train!=null?TR.n_train.toLocaleString():'—'} sub="real labels"/>
              <KPI label="Features" display={c.feature_count} sub={c.algorithm}/>
            </div>
            <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5}}>{TR.design}</div>
            <div style={{fontSize:12.5,color:'#f59e0b',marginTop:8}}>{D.caveat}</div>
            <div style={{fontSize:12,color:'var(--muted)',marginTop:8}}>{c.notes}</div>
          </div>)}

          {c.status==='interim-corrected' && (<div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:12}}>
              <KPI label="PR-AUC (rolling-origin)" display={fmtN(D.pr_auc)} color="#0ea5e9" sub={`no-skill ${fmtN(D.pr_auc_no_skill)}${(D.pr_auc_lift_ci95||[]).length?` · lift CI ${fmtN(D.pr_auc_lift_ci95[0])}–${fmtN(D.pr_auc_lift_ci95[1])}`:''}`}/>
              <KPI label="ROC-AUC" display={fmtN(D.roc_auc)} sub="imbalance-inflated"/>
              <KPI label="Brier" display={fmtN(BR.oof)} sub={`log loss ${fmtN(c.log_loss)}`}/>
              <KPI label="Converting prospects" display={TR.n_converting_prospects} color="#f59e0b" sub={`of ${TR.n_prospects} · Riley-bound`}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:12}}>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>How it was trained</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:10}}>{TR.design}</div>
                {statRow('Estimator', (c.model_selection||{}).chosen, `penalized ${fmtN((c.model_selection||{}).penalized_pr_auc)} / firth ${fmtN((c.model_selection||{}).firth_pr_auc)}`)}
                {statRow('Rows / positives', `${(TR.n_rows||0).toLocaleString()} / ${TR.n_pos_rows}`)}
                {statRow('Base rate', fmtP(TR.base_rate))}
                {statRow('Calibration', `slope ${fmtN(CAL.slope)} · int ${fmtN(CAL.intercept)}`, CAL.method)}
                {statRow('Probability clip', `[${CAL.prob_floor}, ${CAL.prob_ceil}]`)}
              </div>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>Validation status</div>
                <div style={{fontSize:12.5,color:'#0ea5e9',lineHeight:1.5,marginBottom:8}}>{D.caveat}</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:8}}>{(c.walk_forward||{}).status}</div>
                <div style={{fontSize:12,color:'var(--muted)',lineHeight:1.5}}><b>Next:</b> {(c.walk_forward||{}).next}</div>
              </div>
            </div>
            {c.notes && <div style={{fontSize:12,color:'var(--muted)',marginTop:8}}>{c.notes}</div>}
          </div>)}

          {c.status==='shadow' && (<div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:12}}>
              <KPI label="Model AUC (base)" display={fmtN(D.base_auc)} color="#a78bfa" sub={`vs cohort ${fmtN(D.baseline_auc)}`}/>
              <KPI label="AUC lift" display={`+${fmtN(D.base_auc_lift)}`} sub="over cohort baseline"/>
              <KPI label="+ scoops AUC" display={fmtN(D.scoops_auc)} color="#f59e0b" sub={`lift +${fmtN(D.scoops_auc_lift)} · no help`}/>
              <KPI label="Resolved deals" display={TR.resolved_deals} sub={`win ${fmtP(TR.win_rate)} · ${TR.with_zicompany} w/ ZI`}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:12}}>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>How it was trained</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:8}}>{TR.design}</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5}}>{c.validation}</div>
              </div>
              <div style={card}>
                <div style={{fontSize:13.5,fontWeight:600,marginBottom:10}}>Shadow status</div>
                <div style={{fontSize:12.5,color:'#a78bfa',lineHeight:1.5,marginBottom:8}}>{D.caveat}</div>
                <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,marginBottom:8}}>{(c.walk_forward||{}).status}</div>
                <div style={{fontSize:12,color:'var(--muted)',lineHeight:1.5}}><b>Graduation:</b> {(c.walk_forward||{}).next}</div>
              </div>
            </div>
            {c.notes && <div style={{fontSize:12,color:'var(--muted)',marginTop:8}}>{c.notes}</div>}
          </div>)}

          {c.status==='aggregate' && (<div style={{fontSize:13,color:'var(--muted)',lineHeight:1.5}}>{c.notes}</div>)}
        </div>);
      })}
    </div>);
  }

  // ---------------- Marketing cohort targeting ----------------
  function MKTargeting(){
    if(!mkTargeting||!mkTargeting.cohorts||!mkTargeting.cohorts.length) return null;
    const top=mkTargeting.cohorts.slice(0,12).map(c=>({name:`${c.vertical} · ${c.size_band}`, ew:c.expected_winnable}));
    return (<div style={{...card,marginBottom:18}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,flexWrap:'wrap',gap:8}}>
        <div style={{fontSize:14,fontWeight:700}}>Who to reach out to · cohort targeting</div>
        <div style={{fontSize:11,color:'var(--muted)'}}>ranked by expected winnable = addressable × historical win-rate · mkt.CohortCatalog</div>
      </div>
      <div style={{height:300}}><RC.ResponsiveContainer width="100%" height="100%">
        <RC.BarChart data={top} layout="vertical" margin={{top:4,right:46,left:10,bottom:4}}>

          <RC.XAxis type="number" tick={axTick} axisLine={axisLine} tickLine={false}/>

          </RC.Bar>

          <thead style={{position:'sticky',top:0,background:'var(--panel)'}}><tr>
            {['Vertical','Size band','Addressable','Win-rate','Expected winnable'].map(h=><th key={h} style={{textAlign:'left',padding:'8px 12px',fontSize:11,fontWeight:600,color:'var(--muted)',whiteSpace:'nowrap'}}>{h}</th>)}
          </tr></thead>

            {mkTargeting.cohorts.slice(0,15).map((c,i)=>(<tr key={i} style={{borderTop:'1px solid var(--border)'}}>

        </table>

    </div>);

  // ---------------- KPIs ----------------
  let kpis=[];
  if(view==='mf'&&mfData&&mfData.results){ const res=mfData.results; const mean=res.reduce((a,r)=>a+r.churn_probability,0)/(res.length||1); const high=res.filter(r=>r.risk_tier==='high').length; const notice=res.filter(r=>r.has_notice).length;
    kpis=[{label:'Units scored',display:Math.round(res.length*anim).toLocaleString(),sub:`${selBuildings.length} buildings`},
      {label:'Mean move-out prob',display:(mean*anim*100).toFixed(1)+'%',sub:'across scored units'},
      {label:'High-risk count',display:Math.round(high*anim).toLocaleString(),color:RISK.high,sub:`${res.length?Math.round(high/res.length*100):0}% of portfolio`},
      {label:'Tenants w/ notice filed',display:Math.round(notice*anim).toLocaleString(),color:RISK.medium,sub:'formal move-out notice'}]; }
  if(view==='bk'&&bkData){ const d=bkData; const sc=d.scorecard; const rs=d.current_rules_score||{};
    if(sc){ const wp=sc.win_prob||0;
      kpis=[{label:'Win probability',display:(wp*anim*100).toFixed(1)+'%',color:tierColor(wp>=0.3?'high':wp>=0.15?'medium':'low'),sub:'live P(win) = cohort × lift'},
        {label:'Cohort win-rate',display:((sc.cohort_win_rate||0)*anim*100).toFixed(1)+'%',sub:sc.cohort||'size/vertical baseline'},
        {label:'Expected value',display:sc.expected_value?'$'+Math.round(sc.expected_value*anim).toLocaleString():'—',sub:'win_prob × cohort value'},
        {label:'Scoop momentum',display:sc.scoop_count_90d!=null?Math.round(sc.scoop_count_90d*anim).toLocaleString():'—',color:'var(--accent)',sub:'scoops last 90d'}];

            <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-end',gap:18,padding:'18px 20px',borderRadius:14,border:'1px solid var(--border)',background:'var(--panel)',marginBottom:22}}>
              <div><div style={lbl}>Segment type</div>
                <div style={{display:'flex',background:'var(--panel2)',border:'1px solid var(--border)',borderRadius:10,padding:3}}>
                  {['cohort','industry'].map(m=>(<button key={m} onClick={()=>{setMkMode(m); setMkKey(m==='cohort'?(mkCohorts[0]||'healthcare-vertical'):(mkIndustries[0]||'Banking'));}} style={{padding:'7px 18px',borderRadius:8,border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:12.5,fontWeight:600,background:mkMode===m?'var(--accent)':'transparent',color:mkMode===m?'#fff':'var(--muted)',transition:'all .15s',textTransform:'capitalize'}}>{m}</button>))}
                </div>
              </div>
              <div style={{minWidth:240}}><div style={lbl}>{mkMode==='cohort'?'Cohort':'Industry'}</div>
                <select value={mkKey} onChange={e=>setMkKey(e.target.value)} style={{width:'100%',padding:'9px 12px',borderRadius:9,border:'1px solid var(--border)',background:'var(--panel2)',color:'var(--text)',fontFamily:'inherit',fontSize:13,colorScheme:'var(--scheme)'}}>
                  {(mkMode==='cohort'?mkCohorts:mkIndustries).map(o=><option key={o} value={o}>{o}</option>)}
                </select></div>
              <button onClick={runMK} style={runBtn}>{loading?'Aggregating…':'Aggregate'}</button>
            </div>
            {loading && (<div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:22}}>{[0,1,2].map(i=><Skel key={i} h={104}/>)}</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}><Skel h={300}/><Skel h={300}/></div></div>)}
            {ready && mkData && (<div>
              {mkData.error && errBanner(mkData.error)}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:20}}>{kpis.map((k,i)=><KPI key={i} {...k}/>)}</div>
              {(!mkData.by_market||mkData.by_market.length===0) && (<div style={{padding:'14px 16px',borderRadius:10,background:'var(--panel2)',border:'1px solid var(--border)',color:'var(--muted)',fontSize:13,marginBottom:16}}>No companies found for this {mkData.variant||'segment'} · {mkData.segment}.</div>)}
              <MKCharts/>
              <div style={{fontSize:11,color:'var(--muted)',fontFamily:"'JetBrains Mono',monospace",marginTop:14}}>{caption}</div>
            </div>)}
            <div style={{margin:'28px 2px 12px',borderTop:'1px solid var(--border)',paddingTop:20,fontSize:13,fontWeight:700}}>Global cohort ranking <span style={{fontSize:11,fontWeight:400,color:'var(--muted)'}}>— who to reach out to across ALL cohorts (static; independent of the segment selected above)</span></div>
            <MKTargeting/>
          </div>)}
          {/* ===== MODEL VALIDATION ===== */}
          {view==='mv' && (<div>
            {loading && (<div><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:16}}>{[0,1,2,3].map(i=><Skel key={i} h={104}/>)}</div><Skel h={340}/></div>)}
            {!loading && <MV/>}
          </div>)}
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  try {
    var src = document.getElementById('app-src').textContent;
    var out = window.Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  } catch (e) {
    console.error('UI build error', e);
    var r = document.getElementById('root');
    if (r) r.innerHTML = '<pre style="color:#f87171;padding:24px;font-family:monospace;white-space:pre-wrap">UI build error: ' + (e && e.message) + '</pre>';
  }
})();
</script>
</body>
</html>
